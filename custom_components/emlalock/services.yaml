add_time:
  name: Add time
  description: Add a duration to the active EmlaLock session.
  fields:
    entry_id:
      name: Entry ID
      description: The EmlaLock config entry ID.
      required: true
      example: "0123456789abcdef"
      selector:
        text:
    value:
      name: Value
      description: Duration in seconds or an EmlaLock short-term value such as H1, D1, or W1.
      required: true
      example: 3600
      selector:
        text:
    text:
      name: Text
      description: Optional text associated with the duration change.
      required: false
      example: "Home Assistant"
      selector:
        text:

subtract_time:
  name: Subtract time
  description: Subtract a duration from the active EmlaLock session.
  fields:
    entry_id:
      name: Entry ID
      description: The EmlaLock config entry ID.
      required: true
      example: "0123456789abcdef"
      selector:
        text:
    value:
      name: Value
      description: Duration in seconds or an EmlaLock short-term value such as H1, D1, or W1.
      required: true
      example: 3600
      selector:
        text:
    text:
      name: Text
      description: Optional text associated with the duration change.
      required: false
      example: "Home Assistant"
      selector:
        text:

